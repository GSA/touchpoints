applications:
- name: touchpoints-production-sidekiq-worker
  memory: 2G
  disk_quota: 2G
  timeout: 180
  no-route: true
  health-check-type: process
  health-check-invocation-timeout: 180
  # Refuses to start if any migration is still pending when this instance boots.
  # Just a safeguard - migrations should have run in previous CI job.
  command: bin/rails runner "ActiveRecord::Migration.check_pending_migrations" && bundle exec sidekiq -C config/sidekiq.yml
  env:
    LOGIN_GOV_CLIENT_ID: urn:gov:gsa:openidconnect.profiles:sp:sso:gsa-tts-opp:touchpoints
    LOGIN_GOV_IDP_BASE_URL: https://secure.login.gov/
    LOGIN_GOV_REDIRECT_URI: https://touchpoints.app.cloud.gov/users/auth/login_dot_gov/callback
    RAILS_ENV: production
    TOUCHPOINTS_WEB_DOMAIN: touchpoints.app.cloud.gov
    INDEX_URL: /admin
    SKIP_WIDGET_RENDERER: "true"
    API_GATEWAY_BASE_URL: https://api.gsa.gov/analytics/touchpoints
    SILENTLY_REJECT_SPAM: "true"
    STATEMENT_TIMEOUT: 0
  buildpacks:
    - https://github.com/rileyseaburg/rust-buildpack-touchpoints/archive/refs/tags/v1.0.0.zip
    - nodejs_buildpack
    - ruby_buildpack
  services:
    - touchpoints-prod-db
    - touchpoints-redis-service
    - touchpoints-prod-s3
    - touchpoints-prod-deployer
    - touchpoints-s3-uploads
    - name: touchpoints-prod-secrets
      binding_name: touchpoints-secrets
