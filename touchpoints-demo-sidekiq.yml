applications:
  - name: touchpoints-demo-sidekiq-worker
    timeout: 180
    no-route: true
    health-check-type: process
    health-check-invocation-timeout: 180
    # Refuses to start if any migration is still pending when this instance boots.
    # Just a safeguard - migrations should have run in previous CI job.
    command: bin/rails runner "ActiveRecord::Migration.check_pending_migrations" && bin/rails sidekiq -C config/sidekiq.yml
    env:
      # Non-secret env vars only - secrets are set via `cf set-env` and should NOT be in this manifest
      # Empty values here would OVERWRITE existing secrets on cf push!
      LOGIN_GOV_CLIENT_ID: urn:gov:gsa:openidconnect.profiles:sp:sso:gsa-tts-opp:touchpoints-demo
      LOGIN_GOV_IDP_BASE_URL: https://idp.int.identitysandbox.gov/
      LOGIN_GOV_REDIRECT_URI: https://touchpoints-demo.app.cloud.gov/users/auth/login_dot_gov/callback
      RAILS_ENV: production
      TOUCHPOINTS_WEB_DOMAIN: touchpoints-demo.app.cloud.gov
      INDEX_URL: /admin
      SKIP_WIDGET_RENDERER: "true"
      # Secrets managed via cf set-env (DO NOT add empty keys here):
      # - AWS_SES_ACCESS_KEY_ID
      # - AWS_SES_SECRET_ACCESS_KEY
      # - AWS_SES_REGION
      # - LOGIN_GOV_PRIVATE_KEY
      # - NEW_RELIC_KEY
      # - S3_AWS_ACCESS_KEY_ID
      # - S3_AWS_BUCKET_NAME
      # - S3_AWS_REGION
      # - S3_AWS_SECRET_ACCESS_KEY
      # - TOUCHPOINTS_EMAIL_SENDER
      # - TOUCHPOINTS_GTM_CONTAINER_ID
    buildpacks:
      - https://github.com/rileyseaburg/rust-buildpack-touchpoints.git
      - nodejs_buildpack
      - ruby_buildpack
    services:
      - touchpoints-db-demo
      - touchpoints-demo-redis
      - touchpoints-demo-s3
      - touchpoints-demo-s3-uploads
      - touchpoints-staging-deployer
