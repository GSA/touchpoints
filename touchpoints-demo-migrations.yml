applications:
- name: touchpoints-demo-migrations
  memory: 2G
  disk_quota: 2G
  timeout: 180
  env:
    RAILS_ENV: production
    STATEMENT_TIMEOUT: 0
    TOUCHPOINTS_WEB_DOMAIN: touchpoints-demo.app.cloud.gov
    INDEX_URL: /admin
    SKIP_WIDGET_RENDERER: "true"
    BUNDLE_WITHOUT: "development:test:widget_renderer"
  buildpacks:
    - ruby_buildpack
  services:
    - touchpoints-db-demo
    - touchpoints-demo-redis
    - touchpoints-demo-s3
    - touchpoints-demo-s3-uploads
