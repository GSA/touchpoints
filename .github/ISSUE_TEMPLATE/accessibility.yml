name: Accessibility Issue
description: Report a Section 508 / WCAG accessibility barrier
labels: ["accessibility"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Touchpoints forms are used across federal agencies and must meet
        Section 508 and WCAG 2.1 AA requirements. Thanks for helping us
        find and fix barriers.

  - type: input
    id: location
    attributes:
      label: Where is the issue?
      description: Page, URL, or component affected.
      placeholder: "e.g. Touchpoints form submission page, admin dashboard"
    validations:
      required: true

  - type: dropdown
    id: assistive-tech
    attributes:
      label: Assistive technology / method used
      multiple: true
      options:
        - Screen reader (e.g. JAWS, NVDA, VoiceOver)
        - Keyboard-only navigation
        - Screen magnifier / zoom
        - Voice control
        - Automated scanner (e.g. axe, WAVE, Lighthouse)
        - Other / not applicable
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: Describe the barrier
      description: |
        What happens, what did you expect instead, and what WCAG success
        criterion or 508 requirement does it violate (if known)?
      placeholder: |
        What happens:

        What I expected:

        WCAG/508 criterion (if known):
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Navigate using '...'
        3. Observe '...'
    validations:
      required: false

  - type: dropdown
    id: workaround
    attributes:
      label: Is there a way to complete the task another way?
      description: |
        For example, using a different browser, a different input method
        (mouse vs. keyboard), or a different path through the form.
      options:
        - "No — I was not able to complete the task at all"
        - "Yes — I found another way to complete the task, but it took extra steps"
        - "Not applicable / not sure"
    validations:
      required: true
