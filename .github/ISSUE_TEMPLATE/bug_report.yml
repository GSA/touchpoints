name: Bug Report
description: Report a problem with Touchpoints
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below as completely as possible. Do **not** include any PII
        (names, emails, agency-identifying data) from real form submissions —
        use sanitized or synthetic examples only.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
      placeholder: |
        What happened:

        What I expected:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did this happen? (e.g. production, demo, staging, local dev)
      placeholder: "e.g. app.touchpoints.digital.gov, Chrome 128, macOS 15"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any relevant error messages or log output. This will be
        rendered as code automatically. Do not paste secrets, tokens,
        or PII — redact as needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is **not** a security vulnerability (if it is, please follow https://www.gsa.gov/vulnerability-disclosure-policy instead of filing a public issue)
          required: true
